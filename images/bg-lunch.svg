  <!-- Butterflies -->
  <g opacity="0.8">
    <ellipse cx="320" cy="340" rx="12" ry="8" fill="#f48fb1" transform="rotate(-20,320,340)"/>
    <ellipse cx="340" cy="340" rx="12" ry="8" fill="#f48fb1" transform="rotate(20,340,340)"/>
    <ellipse cx="322" cy="348" rx="8" ry="5" fill="#f8bbd0" transform="rotate(15,322,348)"/>
    <ellipse cx="338" cy="348" rx="8" ry="5" fill="#f8bbd0" transform="rotate(-15,338,348)"/>
    <line x1="330" y1="338" x2="330" y2="352" stroke="#ad1457" stroke-width="1.5"/>
    <path d="M327,338 Q328,332 330,330 Q332,332 333,338" fill="none" stroke="#ad1457" stroke-width="1" stroke-linecap="round"/>
  </g>
  <g opacity="0.7">
    <ellipse cx="55" cy="400" rx="10" ry="6" fill="#ce93d8" transform="rotate(-20,55,400)"/>
    <ellipse cx="72" cy="400" rx="10" ry="6" fill="#ce93d8" transform="rotate(20,72,400)"/>
    <ellipse cx="57" cy="407" rx="7" ry="4" fill="#e1bee7" transform="rotate(15,57,407)"/>
    <ellipse cx="70" cy="407" rx="7" ry="4" fill="#e1bee7" transform="rotate(-15,70,407)"/>
    <line x1="63" y1="398" x2="63" y2="410" stroke="#7b1fa2" stroke-width="1.2"/>

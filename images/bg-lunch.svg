    <line x1="110" y1="670" x2="110" y2="650" stroke="#a5d6a7" stroke-width="2.5"/>
    <circle cx="110" cy="646" r="9" fill="#f48fb1"/>
    <circle cx="110" cy="646" r="4.5" fill="#fff9c4"/>

    <line x1="140" y1="680" x2="140" y2="658" stroke="#a5d6a7" stroke-width="2.5"/>
    <circle cx="140" cy="654" r="8" fill="#ce93d8"/>
    <circle cx="140" cy="654" r="4" fill="#fff9c4"/>

    <line x1="245" y1="672" x2="245" y2="652" stroke="#a5d6a7" stroke-width="2.5"/>
    <circle cx="245" cy="648" r="9" fill="#fff176"/>
    <circle cx="245" cy="648" r="4.5" fill="#ff8f00"/>

    <line x1="312" y1="675" x2="312" y2="655" stroke="#a5d6a7" stroke-width="2.5"/>
    <circle cx="312" cy="651" r="8" fill="#f48fb1"/>
    <circle cx="312" cy="651" r="4" fill="#fff9c4"/>

    <line x1="355" y1="668" x2="355" y2="650" stroke="#a5d6a7" stroke-width="2.5"/>
    <circle cx="355" cy="646" r="7" fill="#ce93d8"/>
    <circle cx="355" cy="646" r="3.5" fill="#fff9c4"/>

    <line x1="32" y1="672" x2="32" y2="652" stroke="#a5d6a7" stroke-width="2.5"/>
    <circle cx="32" cy="648" r="8" fill="#ffcc80"/>
    <circle cx="32" cy="648" r="4" fill="#fff9c4"/>

    <line x1="62" y1="668" x2="62" y2="650" stroke="#a5d6a7" stroke-width="2.5"/>
    <circle cx="62" cy="646" r="7" fill="#f06292"/>
    <circle cx="62" cy="646" r="3.5" fill="#fff9c4"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="55%" stop-color="#f1f8e9"/>
      <stop offset="100%" stop-color="#dcedc8"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="55%" cy="8%" r="30%">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fff9c4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur5"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- Sky -->
  <rect width="390" height="844" fill="url(#sky)"/>
  <rect width="390" height="844" fill="url(#sunglow)"/>

  <!-- Big tree left -->
  <rect x="28" y="420" width="22" height="220" rx="6" fill="#a1887f"/>
  <ellipse cx="39" cy="400" rx="58" ry="65" fill="#66bb6a"/>
  <ellipse cx="20" cy="430" rx="40" ry="48" fill="#81c784"/>
  <ellipse cx="62" cy="435" rx="42" ry="46" fill="#4caf50"/>
  <ellipse cx="39" cy="370" rx="44" ry="52" fill="#a5d6a7"/>

  <!-- Big tree right -->
  <rect x="340" y="440" width="20" height="200" rx="5" fill="#a1887f"/>
  <ellipse cx="350" cy="422" rx="52" ry="58" fill="#66bb6a"/>
  <ellipse cx="328" cy="448" rx="38" ry="44" fill="#81c784"/>
  <ellipse cx="370" cy="450" rx="36" ry="42" fill="#4caf50"/>
  <ellipse cx="350" cy="394" rx="40" ry="48" fill="#a5d6a7"/>

  <!-- Mushrooms -->
  <g>
    <rect x="280" y="648" width="12" height="22" rx="3" fill="#fff8e1"/>
    <ellipse cx="286" cy="648" rx="20" ry="14" fill="#ef5350"/>
    <circle cx="278" cy="644" r="3" fill="white" opacity="0.8"/>
    <circle cx="290" cy="641" r="3" fill="white" opacity="0.8"/>
    <circle cx="284" cy="652" r="2.5" fill="white" opacity="0.8"/>
  </g>
  <g>
    <rect x="82" y="655" width="9" height="17" rx="3" fill="#fff8e1"/>
    <ellipse cx="87" cy="655" rx="15" ry="10" fill="#ef9a9a"/>
    <circle cx="81" cy="652" r="2" fill="white" opacity="0.8"/>
    <circle cx="90" cy="650" r="2" fill="white" opacity="0.8"/>
  </g>

  <!-- Pond -->
  <ellipse cx="195" cy="730" rx="80" ry="30" fill="#b3e5fc" opacity="0.6"/>
  <ellipse cx="195" cy="730" rx="80" ry="30" fill="none" stroke="#81d4fa" stroke-width="1.5" opacity="0.5"/>
  <!-- Lily pads -->
  <ellipse cx="165" cy="728" rx="14" ry="9" fill="#66bb6a" opacity="0.8"/>
  <ellipse cx="220" cy="732" rx="12" ry="8" fill="#66bb6a" opacity="0.8"/>
  <circle cx="168" cy="724" r="4" fill="#f06292"/>
  <circle cx="223" cy="728" r="3" fill="#f48fb1"/>


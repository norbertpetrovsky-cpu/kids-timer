  <g filter="url(#blur3)" opacity="0.75">
    <ellipse cx="100" cy="180" rx="60" ry="30" fill="white"/>
    <ellipse cx="74" cy="192" rx="38" ry="24" fill="white"/>
    <ellipse cx="130" cy="194" rx="40" ry="22" fill="white"/>
  </g>
  <g filter="url(#blur3)" opacity="0.6">
    <ellipse cx="310" cy="220" rx="52" ry="26" fill="white"/>
    <ellipse cx="288" cy="230" rx="34" ry="20" fill="white"/>
    <ellipse cx="336" cy="232" rx="36" ry="20" fill="white"/>
  </g>

  <!-- Rainbow faint -->
  <g opacity="0.12">
    <path d="M 30 500 Q 195 200 360 500" stroke="#ef5350" stroke-width="14" fill="none"/>
    <path d="M 40 500 Q 195 215 350 500" stroke="#ff9800" stroke-width="14" fill="none"/>
    <path d="M 50 500 Q 195 230 340 500" stroke="#ffeb3b" stroke-width="14" fill="none"/>
    <path d="M 60 500 Q 195 245 330 500" stroke="#4caf50" stroke-width="14" fill="none"/>
    <path d="M 70 500 Q 195 260 320 500" stroke="#2196f3" stroke-width="14" fill="none"/>
    <path d="M 80 500 Q 195 275 310 500" stroke="#9c27b0" stroke-width="14" fill="none"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="790" width="390" height="54" fill="#a5d6a7"/>
  <ellipse cx="195" cy="790" rx="260" ry="40" fill="#c8e6c9"/>

  <!-- Grass tufts -->
  <g stroke="#66bb6a" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M 0 790 Q 5 778 10 790"/><path d="M 15 792 Q 20 780 25 792"/>
    <path d="M 30 789 Q 35 777 40 789"/><path d="M 50 791 Q 55 779 60 791"/>
    <path d="M 70 790 Q 75 778 80 790"/><path d="M 100 792 Q 105 780 110 792"/>
    <path d="M 130 789 Q 135 777 140 789"/><path d="M 160 791 Q 165 779 170 791"/>
    <path d="M 200 790 Q 205 778 210 790"/><path d="M 230 792 Q 235 780 240 792"/>
    <path d="M 260 789 Q 265 777 270 789"/><path d="M 300 791 Q 305 779 310 791"/>
    <path d="M 340 790 Q 345 778 350 790"/><path d="M 370 792 Q 375 780 380 792"/>
  </g>
</svg>

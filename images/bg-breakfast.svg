<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="60%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#fffde7"/>
    </linearGradient>
    <radialGradient id="sun" cx="75%" cy="15%" r="25%">
      <stop offset="0%" stop-color="#ffe082" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ffca28" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffe082" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="suncore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="60%" stop-color="#ffe57f"/>
      <stop offset="100%" stop-color="#ffd740"/>
    </radialGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Sky -->
  <rect width="390" height="844" fill="url(#sky)"/>
  <!-- Sun glow -->
  <ellipse cx="295" cy="120" rx="110" ry="110" fill="url(#sun)"/>
  <!-- Sun core -->
  <circle cx="295" cy="118" r="42" fill="url(#suncore)"/>
  <circle cx="295" cy="118" r="36" fill="#fff9c4"/>

  <!-- Sun rays -->
  <g stroke="#ffe57f" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="295" y1="62" x2="295" y2="50"/>
    <line x1="295" y1="174" x2="295" y2="186"/>
    <line x1="239" y1="118" x2="227" y2="118"/>
    <line x1="351" y1="118" x2="363" y2="118"/>
    <line x1="255" y1="78" x2="247" y2="70"/>
    <line x1="335" y1="158" x2="343" y2="166"/>
    <line x1="335" y1="78" x2="343" y2="70"/>
    <line x1="255" y1="158" x2="247" y2="166"/>
  </g>

  <!-- Far hills -->
  <ellipse cx="60" cy="680" rx="200" ry="140" fill="#ffe0b2" opacity="0.6"/>
  <ellipse cx="330" cy="700" rx="180" ry="130" fill="#ffcc80" opacity="0.5"/>

  <!-- Cottage -->
  <!-- House body -->
  <rect x="30" y="560" width="130" height="100" rx="4" fill="#fff8e1"/>
  <rect x="30" y="560" width="130" height="100" rx="4" fill="none" stroke="#ffcc80" stroke-width="2"/>
  <!-- Roof -->
  <polygon points="18,562 95,490 172,562" fill="#ff8a65"/>
  <polygon points="18,562 95,490 172,562" fill="none" stroke="#e64a19" stroke-width="2"/>
  <!-- Chimney -->
  <rect x="110" y="500" width="18" height="40" fill="#ef9a9a"/>
  <rect x="107" y="497" width="24" height="6" rx="2" fill="#e57373"/>
  <!-- Smoke -->
  <circle cx="119" cy="488" r="8" fill="white" opacity="0.5" filter="url(#blur2)"/>
  <circle cx="124" cy="472" r="7" fill="white" opacity="0.4" filter="url(#blur2)"/>
  <circle cx="118" cy="457" r="6" fill="white" opacity="0.3" filter="url(#blur2)"/>
  <!-- Door -->
  <rect x="76" y="610" width="28" height="50" rx="14" fill="#ffb74d"/>
  <circle cx="98" cy="636" r="3" fill="#ff8f00"/>
  <!-- Windows -->
  <rect x="38" y="580" width="28" height="24" rx="4" fill="#b3e5fc"/>
  <rect x="38" y="580" width="28" height="24" rx="4" fill="none" stroke="#81d4fa" stroke-width="1.5"/>
  <line x1="52" y1="580" x2="52" y2="604" stroke="#81d4fa" stroke-width="1"/>
  <line x1="38" y1="592" x2="66" y2="592" stroke="#81d4fa" stroke-width="1"/>
  <rect x="115" y="580" width="28" height="24" rx="4" fill="#b3e5fc"/>
  <rect x="115" y="580" width="28" height="24" rx="4" fill="none" stroke="#81d4fa" stroke-width="1.5"/>
  <line x1="129" y1="580" x2="129" y2="604" stroke="#81d4fa" stroke-width="1"/>
  <line x1="115" y1="592" x2="143" y2="592" stroke="#81d4fa" stroke-width="1"/>

  <!-- Flowers along path -->
  <g opacity="0.9">
    <!-- Flower 1 -->
    <line x1="170" y1="650" x2="170" y2="630" stroke="#81c784" stroke-width="2"/>
    <circle cx="170" cy="626" r="8" fill="#f48fb1"/>
    <circle cx="170" cy="626" r="4" fill="#fff9c4"/>
    <!-- Flower 2 -->
    <line x1="200" y1="660" x2="200" y2="638" stroke="#81c784" stroke-width="2"/>
    <circle cx="200" cy="634" r="7" fill="#ce93d8"/>
    <circle cx="200" cy="634" r="3.5" fill="#fff9c4"/>
    <!-- Flower 3 -->
    <line x1="225" y1="648" x2="225" y2="630" stroke="#81c784" stroke-width="2"/>
    <circle cx="225" cy="626" r="8" fill="#ffcc80"/>
    <circle cx="225" cy="626" r="4" fill="#fff9c4"/>
    <!-- Flower 4 -->
    <line x1="255" y1="655" x2="255" y2="636" stroke="#81c784" stroke-width="2"/>
    <circle cx="255" cy="632" r="7" fill="#f48fb1"/>
    <circle cx="255" cy="632" r="3.5" fill="#fff9c4"/>
    <!-- Flower 5 -->
    <line x1="10" y1="648" x2="10" y2="630" stroke="#81c784" stroke-width="2"/>
    <circle cx="10" cy="626" r="7" fill="#ce93d8"/>
    <circle cx="10" cy="626" r="3.5" fill="#fff9c4"/>
  </g>

  <!-- Clouds -->
  <g filter="url(#blur2)">
    <ellipse cx="80" cy="200" rx="55" ry="28" fill="white" opacity="0.85"/>
    <ellipse cx="55" cy="210" rx="35" ry="22" fill="white" opacity="0.85"/>
    <ellipse cx="110" cy="212" rx="38" ry="20" fill="white" opacity="0.85"/>
  </g>
  <g filter="url(#blur2)">
    <ellipse cx="300" cy="260" rx="50" ry="24" fill="white" opacity="0.7"/>
    <ellipse cx="278" cy="268" rx="32" ry="18" fill="white" opacity="0.7"/>
    <ellipse cx="326" cy="270" rx="34" ry="18" fill="white" opacity="0.7"/>
  </g>
  <g filter="url(#blur2)">
    <ellipse cx="170" cy="155" rx="40" ry="20" fill="white" opacity="0.6"/>
    <ellipse cx="152" cy="162" rx="26" ry="15" fill="white" opacity="0.6"/>
    <ellipse cx="192" cy="163" rx="28" ry="15" fill="white" opacity="0.6"/>
  </g>

  <!-- Birds -->
  <g stroke="#ff8f00" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 140 230 Q 148 223 156 230"/>
    <path d="M 160 218 Q 168 211 176 218"/>
    <path d="M 152 245 Q 159 239 166 245"/>
  </g>

  <!-- Ground -->
  <ellipse cx="195" cy="844" rx="260" ry="80" fill="#dcedc8" opacity="0.7"/>
  <rect x="0" y="790" width="390" height="54" fill="#c8e6c9"/>

  <!-- Fence -->
  <g fill="#fff8e1" stroke="#ffcc80" stroke-width="1.5">
    <rect x="170" y="640" width="10" height="50" rx="2"/>
    <rect x="190" y="638" width="10" height="52" rx="2"/>
    <rect x="210" y="640" width="10" height="50" rx="2"/>
    <rect x="230" y="638" width="10" height="52" rx="2"/>
    <rect x="250" y="640" width="10" height="50" rx="2"/>
    <rect x="270" y="638" width="10" height="52" rx="2"/>
    <rect x="290" y="640" width="10" height="50" rx="2"/>
    <rect x="310" y="638" width="10" height="52" rx="2"/>
    <rect x="330" y="640" width="10" height="50" rx="2"/>
    <rect x="350" y="638" width="10" height="52" rx="2"/>
    <rect x="370" y="640" width="10" height="50" rx="2"/>
    <rect x="163" y="652" width="225" height="8" rx="4"/>
    <rect x="163" y="670" width="225" height="8" rx="4"/>
  </g>

  <!-- Sparkle stars -->
  <g fill="#ffe57f" opacity="0.6">
    <polygon points="350,300 352,308 360,308 354,313 356,321 350,316 344,321 346,313 340,308 348,308" transform="scale(0.5) translate(350,340)"/>
    <polygon points="50,350 52,358 60,358 54,363 56,371 50,366 44,371 46,363 40,358 48,358" transform="scale(0.4) translate(60,420)"/>
  </g>
</svg>

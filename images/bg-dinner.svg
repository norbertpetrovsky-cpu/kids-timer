<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="40%" stop-color="#311b92"/>
      <stop offset="75%" stop-color="#4527a0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="72%" cy="14%" r="22%">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#fff176" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fff9c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonball" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="70%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#fff176"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softglow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Night sky -->
  <rect width="390" height="844" fill="url(#sky)"/>
  <!-- Moon glow -->
  <rect width="390" height="844" fill="url(#moonglow)"/>

  <!-- Stars small -->
  <g fill="white">
    <circle cx="20" cy="40" r="1.2" opacity="0.9"/><circle cx="55" cy="18" r="1.5" opacity="0.8"/>
    <circle cx="88" cy="55" r="1" opacity="0.7"/><circle cx="120" cy="30" r="1.8" opacity="0.9"/>
    <circle cx="155" cy="70" r="1" opacity="0.6"/><circle cx="185" cy="25" r="1.4" opacity="0.8"/>
    <circle cx="210" cy="58" r="1.2" opacity="0.9"/><circle cx="240" cy="15" r="1.6" opacity="0.7"/>
    <circle cx="268" cy="48" r="1" opacity="0.8"/><circle cx="10" cy="90" r="1.3" opacity="0.7"/>
    <circle cx="42" cy="120" r="1" opacity="0.6"/><circle cx="78" cy="100" r="1.5" opacity="0.8"/>
    <circle cx="105" cy="135" r="1.2" opacity="0.7"/><circle cx="148" cy="108" r="1" opacity="0.9"/>
    <circle cx="172" cy="145" r="1.4" opacity="0.6"/><circle cx="220" cy="120" r="1.2" opacity="0.8"/>
    <circle cx="255" cy="95" r="1" opacity="0.7"/><circle cx="300" cy="55" r="1.5" opacity="0.9"/>
    <circle cx="330" cy="80" r="1.2" opacity="0.7"/><circle cx="360" cy="35" r="1.6" opacity="0.8"/>
    <circle cx="378" cy="65" r="1" opacity="0.6"/><circle cx="345" cy="120" r="1.3" opacity="0.8"/>
    <circle cx="380" cy="100" r="1.1" opacity="0.7"/><circle cx="15" cy="160" r="1" opacity="0.6"/>
    <circle cx="48" cy="175" r="1.4" opacity="0.7"/><circle cx="90" cy="165" r="1" opacity="0.8"/>
    <circle cx="130" cy="185" r="1.2" opacity="0.6"/>
  </g>

  <!-- Big glowing stars -->
  <g filter="url(#glow)" fill="#fff9c4">
    <circle cx="35" cy="70" r="2.5" opacity="0.9"/>
    <circle cx="160" cy="42" r="3" opacity="0.8"/>
    <circle cx="290" cy="30" r="2.8" opacity="0.9"/>
    <circle cx="370" cy="90" r="2.5" opacity="0.7"/>
    <circle cx="68" cy="145" r="2.2" opacity="0.8"/>
    <circle cx="200" cy="95" r="2.5" opacity="0.7"/>
  </g>

  <!-- 4-pointed sparkle stars -->
  <g fill="#fff9c4" opacity="0.8">
    <path d="M 45 200 L 47 196 L 49 200 L 47 204 Z" filter="url(#glow)"/>
    <path d="M 320 160 L 322 156 L 324 160 L 322 164 Z" filter="url(#glow)"/>
    <path d="M 130 55 L 133 50 L 136 55 L 133 60 Z" filter="url(#glow)"/>
    <path d="M 370 150 L 372 146 L 374 150 L 372 154 Z" filter="url(#glow)"/>
  </g>

  <!-- Moon -->
  <circle cx="282" cy="115" r="52" fill="url(#moonglow)" filter="url(#softglow)"/>
  <circle cx="282" cy="115" r="38" fill="url(#moonball)"/>
  <!-- Moon craters -->
  <circle cx="270" cy="106" r="7" fill="#fff176" opacity="0.4"/>
  <circle cx="292" cy="125" r="5" fill="#fff176" opacity="0.3"/>
  <circle cx="278" cy="126" r="3.5" fill="#fff176" opacity="0.35"/>

  <!-- Castle silhouette -->
  <g fill="#1a0533" opacity="0.85">
    <!-- Base wall -->
    <rect x="60" y="560" width="270" height="130" rx="2"/>
    <!-- Main tower centre -->
    <rect x="145" y="460" width="100" height="120"/>
    <!-- Battlements centre -->
    <rect x="140" y="448" width="18" height="22" rx="2"/>
    <rect x="166" y="448" width="18" height="22" rx="2"/>
    <rect x="192" y="448" width="18" height="22" rx="2"/>
    <rect x="218" y="448" width="18" height="22" rx="2"/>
    <rect x="228" y="448" width="18" height="22" rx="2"/>
    <!-- Left tower -->
    <rect x="68" y="490" width="72" height="100"/>
    <rect x="63" y="478" width="16" height="20" rx="2"/>
    <rect x="83" y="478" width="16" height="20" rx="2"/>
    <rect x="103" y="478" width="16" height="20" rx="2"/>
    <rect x="120" y="478" width="16" height="20" rx="2"/>
    <!-- Right tower -->
    <rect x="250" y="494" width="72" height="96"/>
    <rect x="246" y="482" width="16" height="20" rx="2"/>
    <rect x="266" y="482" width="16" height="20" rx="2"/>
    <rect x="286" y="482" width="16" height="20" rx="2"/>
    <rect x="306" y="482" width="16" height="20" rx="2"/>
    <!-- Gate arch -->
    <rect x="172" y="580" width="46" height="110" rx="23"/>
    <!-- Tower windows with glow -->
  </g>

  <!-- Castle window glows -->
  <g filter="url(#glow)">
    <rect x="178" y="498" width="14" height="20" rx="7" fill="#fff9c4" opacity="0.9"/>
    <rect x="200" y="498" width="14" height="20" rx="7" fill="#fff9c4" opacity="0.9"/>
    <rect x="88" y="520" width="12" height="18" rx="6" fill="#ffcc80" opacity="0.8"/>
    <rect x="256" y="525" width="12" height="18" rx="6" fill="#ffcc80" opacity="0.8"/>
    <rect x="96" y="554" width="10" height="14" rx="5" fill="#fff9c4" opacity="0.6"/>
    <rect x="264" y="558" width="10" height="14" rx="5" fill="#fff9c4" opacity="0.6"/>
    <rect x="120" y="580" width="10" height="14" rx="5" fill="#ffcc80" opacity="0.5"/>
    <rect x="260" y="580" width="10" height="14" rx="5" fill="#ffcc80" opacity="0.5"/>
  </g>

  <!-- Castle flag -->
  <line x1="195" y1="460" x2="195" y2="420" stroke="#7c4dff" stroke-width="2.5"/>
  <polygon points="195,420 220,432 195,444" fill="#e040fb"/>

  <!-- Fireflies -->
  <g filter="url(#glow)" fill="#fff9c4" opacity="0.7">
    <circle cx="32" cy="520" r="3"/>
    <circle cx="358" cy="490" r="2.5"/>
    <circle cx="18" cy="600" r="2"/>
    <circle cx="372" cy="570" r="3"/>
    <circle cx="42" cy="650" r="2.5"/>
    <circle cx="348" cy="640" r="2"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="790" width="390" height="54" fill="#1a0533" opacity="0.9"/>
  <ellipse cx="195" cy="790" rx="280" ry="50" fill="#311b92" opacity="0.6"/>

  <!-- Foreground dark trees -->
  <g fill="#0d0020" opacity="0.8">
    <polygon points="0,690 25,580 50,690"/>
    <polygon points="10,690 28,600 46,690"/>
    <polygon points="340,690 365,578 390,690"/>
    <polygon points="344,690 362,598 380,690"/>
  </g>
</svg>

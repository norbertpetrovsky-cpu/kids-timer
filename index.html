<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffe0b2">
<title>Elizabeth's Magic Meal Timer 🐰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="meal-breakfast">

<div id="scene-bg"></div>
<div id="scene-bg-next"></div>

<!-- ═══ HOME SCREEN ═══ -->
<div class="screen" id="screen-home">
  <div class="app home-app">
    <div class="header">
      <h1>🍽️ Elizabeth's Magic Timer</h1>
      <div class="subtitle" id="home-subtitle">What are we eating? 🍴</div>
    </div>
    <div class="meal-cards">
      <button class="meal-card" id="card-breakfast" onclick="selectMeal('breakfast')">
        <div class="meal-card-scene" id="card-scene-breakfast"><div class="meal-card-emoji">🥞</div></div>
        <div class="meal-card-label">Breakfast</div>
        <div class="meal-card-time" id="card-time-breakfast">15 min</div>
        <div class="meal-card-check">✓</div>
      </button>
      <button class="meal-card" id="card-lunch" onclick="selectMeal('lunch')">
        <div class="meal-card-scene" id="card-scene-lunch"><div class="meal-card-emoji">🥣</div></div>
        <div class="meal-card-label">Lunch</div>
        <div class="meal-card-time" id="card-time-lunch">30 min</div>
        <div class="meal-card-check">✓</div>
      </button>
      <button class="meal-card" id="card-dinner" onclick="selectMeal('dinner')">
        <div class="meal-card-scene" id="card-scene-dinner"><div class="meal-card-emoji">🍽️</div></div>
        <div class="meal-card-label">Dinner</div>
        <div class="meal-card-time" id="card-time-dinner">30 min</div>
        <div class="meal-card-check">✓</div>
      </button>
    </div>
    <div class="slider-section">
      <div class="slider-label">
        <span>How long?</span>
        <span class="slider-value" id="slider-value">15 minutes ⏱️</span>
      </div>
      <div class="slider-wrap">
        <div class="slider-track-wrap">
          <input type="range" class="time-slider" id="time-slider"
            min="5" max="60" step="5" value="15"
            oninput="onSliderChange(this.value)">
          <div class="slider-thumb-tooltip" id="slider-tooltip">15 min</div>
        </div>
      </div>
    </div>
    <button class="go-btn" onclick="goToFoodPicker()">Choose food 🍽️</button>
  </div>
</div>

<!-- ═══ FOOD PICKER SCREEN ═══ -->
<div class="screen hidden" id="screen-food">
  <div class="app food-app">
    <div class="food-header">
      <button class="back-btn" onclick="goHome()">← Back</button>
      <div class="food-title">What is Elizabeth eating? 🍴</div>
    </div>
    <div class="food-counter-wrap">
      <div class="food-counter" id="food-counter">0 / 5 selected</div>
      <div class="food-counter-hint">Tap to select, max 5</div>
    </div>
    <div class="food-grid-scroll">
      <div id="food-grid"></div>
    </div>
    <button class="go-btn food-go-btn" id="food-go-btn" onclick="goToTimer()" disabled>
      Start eating! 🐰
    </button>
  </div>
</div>

<!-- ═══ TIMER SCREEN ═══ -->
<div class="screen hidden" id="screen-timer">
  <div class="app timer-app">

    <!-- Top bar -->
    <div class="timer-topbar">
      <button class="back-btn" onclick="goToFoodPickerFromTimer()">← Back</button>
      <div class="timer-meal-label" id="timer-meal-label">🥞 Breakfast</div>
      <div style="width:70px"></div>
    </div>

    <!-- Animal companion — replaces bunny entirely -->
    <div class="animal-stage">
      <div class="animal-wrap" id="animal-wrap">
        <div id="lottie-animal"></div>
      </div>
      <div class="animal-name-display" id="animal-name-main">🐾 Friend</div>
      <div class="mood-bubble" id="mood-text">Ready to eat, Elizabeth? 🍴</div>
    </div>

    <!-- Magic plate -->
    <div class="plate-section">
      <div class="plate-wrap" id="plate-wrap">
        <canvas id="plate-canvas"></canvas>
      </div>
      <div class="timer-display" id="timer-display">15:00</div>
    </div>

    <!-- Controls -->
    <div class="timer-card">
      <div class="paused-badge" id="paused-badge">⏸ PAUSED</div>
      <div class="controls">
        <button class="ctrl-btn btn-start" id="btn-start" onclick="startTimer()">▶ Start</button>
        <button class="ctrl-btn btn-pause" id="btn-pause" onclick="pauseTimer()" style="display:none">⏸ Pause</button>
        <button class="ctrl-btn btn-reset" id="btn-reset" onclick="resetTimer()">↺ Reset</button>
      </div>
    </div>

    <button class="done-btn" id="done-btn" onclick="celebrate('done')">🎉 I'm done eating!</button>

  </div>
</div>

<!-- ═══ CELEBRATION ═══ -->
<div class="celebrate" id="celebrate-overlay">
  <div class="celebrate-bg"></div>
  <div class="celebrate-icon" id="celeb-icon">🎉</div>
  <div class="stars-anim">⭐ ⭐ ⭐</div>
  <h2 id="celeb-title">Wonderful, Elizabeth!</h2>
  <p id="celeb-msg">You finished your meal! 👑🐰</p>
  <button class="dismiss-btn" onclick="dismissCelebration()">Again! 🐰</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script src="js/sounds.js"></script>
<script src="js/foods.js"></script>
<script src="js/animals.js"></script>
<script src="js/plate.js"></script>
<script src="js/app.js"></script>
</body>
</html>
